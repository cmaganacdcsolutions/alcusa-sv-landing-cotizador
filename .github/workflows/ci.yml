name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  PUBLIC_COTIZADOR_MODE: mock
  PUBLIC_SITE_URL: https://alcusasv.com
  PUBLIC_WHATSAPP_NUMBER: '50376802410'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: |
          if git grep -nEI "(WOMPI_CLIENT_SECRET|WOMPI_WEBHOOK_SECRET|WOMPI_API_SECRET)\s*=\s*['\"a-zA-Z0-9]" -- . ':!.env.example' ':!docs' ':!.github'; then
            echo "Possible committed secret found." >&2
            exit 1
          fi

      - name: PHP syntax + pure unit checks (no credentials, no network)
        run: |
          for f in api/*.php api/_lib/*.php api/_dev/*.php; do php -l "$f"; done
          php api/_dev/wompi-smoke.php unit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (coverage)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Bundle size report
        run: node scripts/check-bundle-size.mjs

  # E2E runs in the pinned Playwright image so the Linux visual baselines
  # (*-linux.png) are always rendered with the same fonts/browsers.
  # Keep the image tag in sync with @playwright/test (package.json) and visual-baselines.yml.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
