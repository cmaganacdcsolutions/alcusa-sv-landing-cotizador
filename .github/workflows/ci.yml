name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

# Least privilege (SEC-005): no job needs more than read access to the repo.
permissions:
  contents: read

env:
  PUBLIC_SITE_URL: https://alcusasv.com
  PUBLIC_WHATSAPP_NUMBER: '50376802410'

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production-dependency audit (SEC-005). Blocks on high/critical.
      # The 2 highs previously reported in the Astro build chain (http-cache-semantics,
      # source-map-js) were fixed by a lockfile-only bump, so there is no ignore list.
      # If a future high has no fix, document it here with an expiry date; do not drop the gate.
      - name: Dependency audit (root, prod deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (server, prod deps)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (coverage)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Bundle size report
        run: node scripts/check-bundle-size.mjs

  # Secret scan over the full git history (SEC-005). gitleaks is a pinned release binary
  # verified against a hard-coded sha256 (the gitleaks-action needs a paid license for orgs).
  # Known false positives live in .gitleaksignore (fingerprint + reason).
  secret-scan:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan history for secrets
        run: ./gitleaks detect --source . --redact --no-banner

  # E2E runs in the pinned Playwright image so the Linux visual baselines
  # (*-linux.png) are always rendered with the same fonts/browsers.
  # Keep the image tag in sync with @playwright/test (package.json) and visual-baselines.yml.
  e2e:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
