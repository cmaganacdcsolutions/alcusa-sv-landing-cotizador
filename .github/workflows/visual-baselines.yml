# Generates the LINUX visual baselines (*-linux.png) in the same pinned image used by ci.yml.
#
# How to regenerate in the future (intentional visual change, with user approval):
#   - Push a branch named ci-visual-baselines (this workflow fires on that branch), or, once this file
#     is on main, run it from Actions > visual-baselines > Run workflow (workflow_dispatch).
#   - Download the "linux-baselines" artifact, review the PNGs, and commit them to
#     tests/e2e/__snapshots__/<spec>/ by hand. CI never commits.
#   - Keep the image tag in sync with @playwright/test in package.json and with ci.yml.
name: visual-baselines

on:
  workflow_dispatch:
  push:
    branches: [ci-visual-baselines]

permissions:
  contents: read

env:
  PUBLIC_COTIZADOR_MODE: mock
  PUBLIC_SITE_URL: https://alcusasv.com
  PUBLIC_WHATSAPP_NUMBER: '50376802410'

jobs:
  baselines:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Linux baselines
        run: npm run test:visual:update

      - name: Verify stability (pass 1, no update)
        run: npm run test:visual

      - name: Verify stability (pass 2, no update)
        run: npm run test:visual

      - name: Upload Linux baselines
        uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: tests/e2e/__snapshots__/**/*-linux.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
